<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a3728;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#6b4f3f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b6f5c;stop-opacity:1" />
    </linearGradient>
    <pattern id="texture" patternUnits="userSpaceOnUse" width="100" height="100">
      <circle cx="50" cy="50" r="1" fill="rgba(255,255,255,0.05)"/>
      <circle cx="25" cy="25" r="0.5" fill="rgba(255,255,255,0.03)"/>
      <circle cx="75" cy="75" r="0.5" fill="rgba(255,255,255,0.03)"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg-gradient)"/>
  <rect width="1920" height="1080" fill="url(#texture)"/>
  <!-- Decorative elements suggesting a restaurant ambiance -->
  <ellipse cx="960" cy="800" rx="400" ry="100" fill="rgba(0,0,0,0.2)"/>
  <ellipse cx="960" cy="780" rx="350" ry="80" fill="rgba(139,111,92,0.3)"/>
  <!-- Table suggestion -->
  <rect x="760" y="700" width="400" height="20" rx="10" fill="rgba(74,55,40,0.4)"/>
  <!-- Wine glass silhouettes -->
  <g fill="rgba(255,255,255,0.1)">
    <path d="M850 680 L860 680 L865 650 L870 620 L860 620 L855 640 L850 620 L840 620 L845 650 Z"/>
    <path d="M1050 680 L1060 680 L1065 650 L1070 620 L1060 620 L1055 640 L1050 620 L1040 620 L1045 650 Z"/>
  </g>
  <!-- Plate suggestion -->
  <circle cx="960" cy="680" r="50" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.05)" stroke-width="2"/>
  <circle cx="960" cy="680" r="35" fill="rgba(255,255,255,0.03)"/>
</svg>
